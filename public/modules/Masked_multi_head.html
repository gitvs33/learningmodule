<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Transformer: Masked Multi-Head Attention</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
    <style>
        body {
            font-family: 'Inter', sans-serif;
            background-color: #f0f4f8;
        }
        .word {
            cursor: pointer;
            transition: all 0.3s ease;
            position: relative;
            z-index: 10;
        }
        .word.active {
            transform: scale(1.1);
            background-color: #db2777; /* pink-600 */
            color: white;
        }
        .word.masked {
            opacity: 0.3;
            filter: blur(2px);
            background-color: #e2e8f0; /* slate-200 */
        }
        .attention-line-container {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            pointer-events: none;
            z-index: 5;
        }
        .attention-line {
            position: absolute;
            height: 2.5px;
            transform-origin: left center;
            transition: all 0.3s ease;
            mix-blend-mode: multiply;
        }
    </style>
</head>
<body class="bg-slate-100 text-slate-800 flex items-center justify-center min-h-screen p-4">

    <div class="w-full max-w-4xl mx-auto bg-white p-6 md:p-8 rounded-2xl shadow-lg">
        
        <!-- Header -->
        <div class="text-center mb-6">
            <h1 class="text-2xl md:text-3xl font-bold text-slate-900">Masked Multi-Head Attention</h1>
            <p class="text-slate-600 mt-2 max-w-3xl mx-auto">This is the Decoder's self-attention. The "mask" prevents it from cheating by looking ahead at future words when generating a sequence.</p>
        </div>

        <!-- Sentence Input -->
        <div class="mb-6 flex flex-col sm:flex-row gap-2">
            <input type="text" id="sentenceInput" class="flex-grow p-3 border border-slate-300 rounded-lg focus:ring-2 focus:ring-pink-400 focus:outline-none" value="The cat sat on the mat">
            <button id="updateSentenceBtn" class="bg-pink-500 text-white font-semibold py-3 px-5 rounded-lg hover:bg-pink-600 transition-colors">Visualize Sentence</button>
        </div>

        <!-- Legend -->
        <div id="legend" class="flex justify-center items-center flex-wrap gap-4 mb-6 text-sm font-medium">
            <!-- JS will populate this -->
        </div>

        <!-- Visualization Container -->
        <div id="visualization" class="relative w-full min-h-[250px] md:min-h-[200px] flex items-center justify-center">
            <!-- Attention lines will be drawn here -->
            <div id="attention-lines" class="attention-line-container"></div>
            <!-- Words will be injected here -->
            <div id="sentence-container" class="flex flex-wrap gap-x-4 gap-y-8 justify-center items-center text-lg md:text-xl font-medium">
            </div>
        </div>

        <!-- Explanation Box -->
        <div id="explanation" class="mt-8 p-4 bg-slate-50 border border-slate-200 rounded-lg text-center min-h-[100px]">
            <p class="text-slate-500 italic">Select a word to begin the visualization.</p>
        </div>

    </div>

    <script>
        // DOM Elements
        const sentenceContainer = document.getElementById('sentence-container');
        const attentionLinesContainer = document.getElementById('attention-lines');
        const explanationBox = document.getElementById('explanation');
        const sentenceInput = document.getElementById('sentenceInput');
        const updateSentenceBtn = document.getElementById('updateSentenceBtn');
        const legendContainer = document.getElementById('legend');

        // Configuration
        const HEAD_CONFIG = [
            { name: 'Head 1', color: 'bg-orange-400', colorHex: '#fb923c' },
            { name: 'Head 2', color: 'bg-sky-400', colorHex: '#38bdf8' },
            { name: 'Head 3', color: 'bg-emerald-400', colorHex: '#34d399' }
        ];
        const NUM_HEADS = HEAD_CONFIG.length;

        // State
        let words = [];
        let wordElements = [];
        let vectors = {}; 

        // --- Core Functions ---

        const generateVector = (size) => Array.from({ length: size }, () => Math.random() * 2 - 1);
        const dotProduct = (vecA, vecB) => vecA.map((val, i) => val * vecB[i]).reduce((sum, val) => sum + val, 0);
        
        /**
         * Softmax function with masking.
         * @param {number[]} scores - The raw attention scores.
         * @param {number} sourceIndex - The index of the word paying attention.
         * @returns {number[]} - The normalized scores.
         */
        const softmax = (scores, sourceIndex) => {
            const maskedScores = scores.map((score, targetIndex) => {
                // If the target is in the "future", mask it by setting score to negative infinity
                return targetIndex > sourceIndex ? -Infinity : score;
            });

            const d_k = 16;
            const scaled_scores = maskedScores.map(score => score / Math.sqrt(d_k));
            const max = Math.max(...scaled_scores.filter(s => isFinite(s))); // Max of non-infinite scores
            if (!isFinite(max)) return Array(scores.length).fill(0);

            const exps = scaled_scores.map(score => Math.exp(score - max));
            const sumExps = exps.reduce((sum, exp) => sum + exp, 0);
            if (sumExps === 0) return Array(scores.length).fill(0);
            
            return exps.map(exp => exp / sumExps);
        };

        const setupSentence = () => {
            const sentence = sentenceInput.value.trim();
            if (!sentence) return;

            words = sentence.split(/\s+/);
            sentenceContainer.innerHTML = '';
            attentionLinesContainer.innerHTML = '';
            wordElements = [];
            vectors = {};

            words.forEach((word, wordIndex) => {
                vectors[wordIndex] = Array.from({ length: NUM_HEADS }, () => ({
                    query: generateVector(16),
                    key: generateVector(16),
                }));

                const wordEl = document.createElement('div');
                wordEl.textContent = word;
                wordEl.dataset.index = wordIndex;
                wordEl.className = 'word p-3 rounded-lg bg-slate-200 shadow-sm';
                sentenceContainer.appendChild(wordEl);
                wordElements.push(wordEl);
            });
            
            setupLegend();
            resetExplanation();
            addEventListeners();
        };

        const setupLegend = () => {
            legendContainer.innerHTML = '';
            HEAD_CONFIG.forEach(head => {
                const legendItem = document.createElement('div');
                legendItem.className = 'flex items-center gap-2';
                legendItem.innerHTML = `<div class="w-4 h-4 rounded-full ${head.color}"></div><span>${head.name}</span>`;
                legendContainer.appendChild(legendItem);
            });
        };

        const addEventListeners = () => {
            wordElements.forEach(el => {
                el.addEventListener('click', handleWordClick);
            });
        };

        const handleWordClick = (e) => {
            const clickedIndex = parseInt(e.target.dataset.index);
            if (isNaN(clickedIndex)) return;

            wordElements.forEach((el, index) => {
                el.classList.remove('active', 'masked');
                // Apply mask to words in the "future"
                if (index > clickedIndex) {
                    el.classList.add('masked');
                }
            });
            e.target.classList.add('active');
            
            attentionLinesContainer.innerHTML = '';
            visualizeAllHeads(clickedIndex);
        };

        const visualizeAllHeads = (sourceIndex) => {
            const sourceWord = words[sourceIndex];

            for (let headIndex = 0; headIndex < NUM_HEADS; headIndex++) {
                const sourceHeadVectors = vectors[sourceIndex][headIndex];
                
                const attentionScores = words.map((_, targetIndex) => {
                    const targetHeadVectors = vectors[targetIndex][headIndex];
                    return dotProduct(sourceHeadVectors.query, targetHeadVectors.key);
                });

                // Apply softmax WITH the mask
                const normalizedScores = softmax(attentionScores, sourceIndex);
                drawAttentionForHead(sourceIndex, normalizedScores, HEAD_CONFIG[headIndex].colorHex);
            }
            
            updateExplanation(sourceWord);
        };

        const drawAttentionForHead = (sourceIndex, scores, color) => {
            const sourceEl = wordElements[sourceIndex];
            const sourceRect = sourceEl.getBoundingClientRect();
            const containerRect = attentionLinesContainer.getBoundingClientRect();
            const sourceX = sourceRect.left + sourceRect.width / 2 - containerRect.left;
            const sourceY = sourceRect.top + sourceRect.height / 2 - containerRect.top;

            wordElements.forEach((targetEl, targetIndex) => {
                // Only draw lines to non-masked words
                if (targetIndex > sourceIndex) return;
                
                const score = scores[targetIndex];
                if (score < 0.01) return;

                const targetRect = targetEl.getBoundingClientRect();
                const targetX = targetRect.left + targetRect.width / 2 - containerRect.left;
                const targetY = targetRect.top + targetRect.height / 2 - containerRect.top;

                const angle = Math.atan2(targetY - sourceY, targetX - sourceX) * 180 / Math.PI;
                const distance = Math.sqrt(Math.pow(targetX - sourceX, 2) + Math.pow(targetY - sourceY, 2));

                const line = document.createElement('div');
                line.className = 'attention-line';
                line.style.width = `${distance}px`;
                line.style.left = `${sourceX}px`;
                line.style.top = `${sourceY}px`;
                line.style.transform = `rotate(${angle}deg)`;
                line.style.backgroundColor = color;
                line.style.opacity = `${0.1 + score * 0.8}`;
                
                attentionLinesContainer.appendChild(line);
            });
        };
        
        const updateExplanation = (word) => {
            explanationBox.innerHTML = `
                <p class="text-slate-800">
                    Visualizing attention from <strong class="text-pink-600">"${word}"</strong>.
                </p>
                <p class="text-slate-600 mt-1">
                    Notice how it can only attend to itself and previous words. The words to the right are "masked" (hidden) to prevent the model from looking into the future while generating a sequence.
                </p>
            `;
        };
        
        const resetExplanation = () => {
            explanationBox.innerHTML = `<p class="text-slate-500 italic">Select a word to begin the visualization.</p>`;
            wordElements.forEach(el => el.classList.remove('active', 'masked'));
        };

        // --- Event Listeners ---
        updateSentenceBtn.addEventListener('click', setupSentence);
        window.addEventListener('resize', () => {
            const activeWord = document.querySelector('.word.active');
            if (activeWord) {
                handleWordClick({ target: activeWord });
            }
        });

        // Initial setup
        window.onload = setupSentence;
    </script>
</body>
</html>
